spring.application.name=trending-news

# Render (and most PaaS) inject the port via $PORT; default to 8080 locally.
server.port=${PORT:8080}

# Be tolerant of slow/odd feeds; keep the app responsive.
spring.mvc.async.request-timeout=60000

# Compact JSON, omit null fields.
spring.jackson.default-property-inclusion=non_null

logging.level.com.trendingnews=INFO
